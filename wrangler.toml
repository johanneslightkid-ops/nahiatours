# ==============================================================================
# Amigo Tours — Cloudflare Worker (static assets + API routes)
# ==============================================================================
#
# A SEPARATE SITE out of the same repository, not a change to any existing one.
# `nahiatours` is production, `ldvip` and `transporturist` are earlier designs,
# and this is the oil-painting one. `wrangler deploy` addresses a Worker by
# name, so the name below is the only thing that decides where this lands, and
# the deploy workflow asserts it before it uploads anything.
#
# Served at https://amigotours.johannes-neugschwentner.workers.dev
#
# worker/index.ts dispatches to the same functions/* handlers the Pages
# deployment used, so no endpoint logic is duplicated.

name = "amigotours"
main = "worker/index.ts"
compatibility_date = "2024-05-01"
workers_dev = true

# Pinned so neither wrangler nor the KV scripts have to discover the account by
# listing /memberships — an endpoint a Workers-scoped token cannot read.
account_id = "d5272033401c64f8cc6ce650a8321cb2"

# Static build output. `single-page-application` serves index.html for paths
# with no matching file, which is what React Router needs for /tours, /plan and
# the rest. API routes never reach this: worker/index.ts matches them first.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Without this, the asset server answers before the Worker for any path that
# matches a file, so the canonical-host redirect would silently stop applying
# to page loads.
run_worker_first = true

# ==============================================================================
# Workers AI
# ==============================================================================
#
# The blog generator used to need an account id and an API token typed into the
# admin panel before it would produce a sentence — on a fresh deployment that
# meant the feature was present and dead. This binding is the account's own
# Workers AI, granted to the Worker at deploy time, so /api/cf-ai can run a
# model with no credentials at all (functions/api/cf-ai.ts prefers it and only
# falls back to the REST API when the admin has entered a token of their own).
#
# Nothing to create and nothing to paste: the binding exists because this line
# does.
[ai]
binding = "AI"

# ==============================================================================
# KV
# ==============================================================================
#
# scripts/provision-kv.mjs rewrites the block below during `npm run build`,
# resolving KV_NAMESPACE_TITLE (amigotours-data in the deploy workflow) to an
# id and creating the namespace if it does not exist yet. Do not edit it by
# hand — the next build overwrites it.
#
# The handlers read DATA_KV_F first and fall back to DATA_KV
# (functions/api/data.ts), so binding either name is enough.
#
# Until a namespace exists the site still works: reads fall back to the JSON
# bundled at /data/*.json. Only admin writes and /api/init-data need KV.

# ==============================================================================
# Environment variables
# ==============================================================================
#
# ADMIN_PASSWORD is the INITIAL password only. It is read on the server
# (shared/adminAuth.ts) and never reaches the browser, but it is committed here
# in plaintext, so treat it as public.
#
# Once the site is up, change it from the admin panel (Ajustes de marca →
# Contraseña del panel). That writes the new password to KV, and KV wins over
# this var from then on — so the committed value stops being the password the
# moment somebody changes it, without a redeploy.
#
# TODO: CLOUDINARY_API_SECRET is in plaintext here and its VITE_ copy is
# compiled into the client bundle where any visitor can read it. That one needs
# rotating, not just relocating.

[vars]
# Which site and which branch this configuration belongs to, reported by
# /api/health. Five sites share this repository, and when one of them starts
# serving another's pages there is otherwise nothing to read: these two lines
# make a wrongly-routed domain say so in one request. They are labels, not
# settings — nothing reads them but the health endpoint.
SITE = "amigotours"
SITE_BRANCH = "amigotours"

ADMIN_PASSWORD = "admin"
CLOUDINARY_CLOUD_NAME = "dkxlhxpe4"
CLOUDINARY_API_KEY = "896279918126553"
CLOUDINARY_API_SECRET = "stWvhkCOQi_2Q_Ko0d1it8LXWr8"
CLOUDINARY_UPLOAD_PRESET = ""
VITE_CLOUDINARY_CLOUD_NAME = "dkxlhxpe4"
VITE_CLOUDINARY_API_KEY = "896279918126553"
VITE_CLOUDINARY_API_SECRET = "stWvhkCOQi_2Q_Ko0d1it8LXWr8"
VITE_CLOUDINARY_UPLOAD_PRESET = ""
