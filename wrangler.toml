# ==============================================================================
# Cloudflare Worker configuration — LD VIP
# ==============================================================================
#
# This is the `ld_vip` branch, and it deploys to its own Worker: `ld-vip`, not
# `nahiatours`. The name lives here rather than in a second config file on
# purpose — the branch is never merged, so the branch *is* the deployment, and
# there is no way for a deploy from here to land on the nahiatours Worker by
# accident.
#
# The two deployments share nothing: separate Worker, separate workers.dev
# hostname, and a separate KV namespace (scripts/provision-kv.mjs derives the
# namespace title from the name below, so `ld-vip` gets `ld-vip-data`).
#
# The project deploys with `npx wrangler deploy`, the Workers command. It needs
# `main` (a script entry point) and `[assets]` (a directory to upload); a Pages
# config with `pages_build_output_dir` provides neither.

name = "ld-vip"
main = "worker/index.ts"
compatibility_date = "2024-05-01"

# Serve this Worker at https://ld-vip.<account-subdomain>.workers.dev.
# It is the default for a Worker with assets, but it is the whole point of this
# deployment — the redesign has to be reachable at a URL of its own — so it is
# stated rather than inherited.
workers_dev = true

# Static build output. `single-page-application` serves index.html for paths
# with no matching file, which is what React Router needs for /tours, /plan and
# the rest. API routes never reach this: worker/index.ts matches them first.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Without this, the asset server answers before the Worker for any path that
# matches a file, so the canonical-host redirect would silently stop applying
# to page loads. Pages ran _middleware.ts on every path (_routes.json includes
# "/*"), and this keeps that true.
run_worker_first = true

# ==============================================================================
# KV
# ==============================================================================
#
# scripts/provision-kv.mjs runs first inside `npm run build` and writes the
# binding into this file, so nothing has to be pasted in by hand and nothing
# has to be committed. It names the namespace after the Worker (`ld-vip-data`),
# which is what keeps this deployment's data out of nahiatours'.
#
# The handlers read DATA_KV_F first and fall back to DATA_KV
# (functions/api/data.ts), so binding either name is enough.
#
# Until the namespace exists the site still works: reads fall back to the JSON
# bundled at /data/*.json. Only admin writes and /api/init-data need KV.
#
# Note this is a Worker, so wrangler.toml is the source of truth for bindings —
# a binding added in the dashboard is overwritten by the next deploy.

# ==============================================================================
# Environment variables
# ==============================================================================
#
# CANONICAL_HOST is deliberately unset. shared/canonical.ts only redirects when
# it is set, so this deployment serves under its own hostname instead of 301ing
# visitors to the nahiatours domain.
#
# ADMIN_PASSWORD is read only on the server (shared/adminAuth.ts) and never
# reaches the browser — but it is committed here in plaintext, so treat it as
# public. It is the default, not a secret.
#
# To use a real one without putting it in the repo:
#   1. delete the ADMIN_PASSWORD line below
#   2. npx wrangler secret put ADMIN_PASSWORD
# Do both: a [vars] entry and a secret of the same name collide, and the
# plaintext var can win on deploy.
#
# TODO: the same goes for CLOUDINARY_API_SECRET. Its VITE_ copy is compiled
# into the client bundle where any visitor can read it, so that one needs
# rotating, not just relocating.

[vars]
ADMIN_PASSWORD = "admin"
CLOUDINARY_CLOUD_NAME = "dkxlhxpe4"
CLOUDINARY_API_KEY = "896279918126553"
CLOUDINARY_API_SECRET = "stWvhkCOQi_2Q_Ko0d1it8LXWr8"
CLOUDINARY_UPLOAD_PRESET = ""
VITE_CLOUDINARY_CLOUD_NAME = "dkxlhxpe4"
VITE_CLOUDINARY_API_KEY = "896279918126553"
VITE_CLOUDINARY_API_SECRET = "stWvhkCOQi_2Q_Ko0d1it8LXWr8"
VITE_CLOUDINARY_UPLOAD_PRESET = ""
