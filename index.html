    <!-- Type.

         Linked here rather than @import-ed from the stylesheet: an @import
         cannot start downloading until the stylesheet itself has been fetched
         and parsed, which puts the whole of the type behind a request chain
         the browser could otherwise have started at the first byte.

         Two families, asked for as weight ranges so Google serves one
         variable file each. Playfair Display carries the display sizes — a
         Didone's thick-to-thin is the typographic form of a loaded brush —
         and its italic doubles as the signature in the corner of the canvas,
         which is why there is no third script face to download. Manrope says
         the prices. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500..900;1,500..600&family=Manrope:wght@400..800&display=swap"
    />

    <!-- The hero photograph is what a visitor is waiting for, and in a
         client-rendered app the browser cannot find it until the bundle has
         downloaded, parsed and run. Naming it here starts it immediately. -->
    <link
      rel="preload"
      as="image"
      href="/imgs/tours/tour_saona_island_detail_12.jpg"
      fetchpriority="high"
    />
