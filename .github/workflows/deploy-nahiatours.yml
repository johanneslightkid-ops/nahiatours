# Deploys the production site, nahia.tours, to the `nahiatours` Worker.
#
# WHY THIS FILE EXISTS. Until now `main` was the one branch with no workflow.
# It shipped through Cloudflare's own git integration, which builds the branch
# and runs `wrangler deploy` — and that is where the site lost its data.
#
# `npm run build` begins with scripts/provision-kv.mjs, which resolves the KV
# namespace by title and writes the binding into wrangler.toml. It needs a
# Cloudflare API token to do that, and it is explicitly written never to fail a
# build without one: it warns and exits 0. A Cloudflare build has no
# CLOUDFLARE_API_TOKEN in its environment, so on every one of those deploys the
# step was skipped, wrangler.toml went to the deploy with no [[kv_namespaces]]
# at all, and — this is the part that bites — a Worker deploy REPLACES the
# Worker's bindings with exactly what the config declares. So each deploy
# unbound the namespace.
#
# A Worker with no KV is not visibly broken. functions/api/data.ts falls back
# to the JSON bundled in the build, so the site comes up looking fine, serving
# the seed catalogue instead of whatever the operator had edited — which is
# precisely the "it reset itself to the default values again" this repository
# has been chasing. Admin saves went the same way: nowhere to write, 200 back,
# nothing kept.
#
# Here the token is present, so provision-kv resolves `nahiatours-data` and the
# binding is in the config by the time wrangler reads it. The deploy log prints
# the bindings it applied, so there is a record rather than an assumption.
#
# NOTE ON THE TRIGGER. Deliberately manual. If Cloudflare's git integration is
# still connected to this project, a push would start two deploys of the same
# commit and whichever finished last would win — and one of those two has no
# KV. Manual means this one is the deliberate one. Once the Cloudflare side is
# disconnected, add `push: branches: [main]` here.

name: Deploy nahia.tours

on:
  workflow_dispatch:
    inputs:
      cloudflare_api_token:
        description: >-
          One-off Cloudflare API token (Workers Scripts: Edit + Workers KV
          Storage: Edit). Leave empty to use the CLOUDFLARE_API_TOKEN secret.
        required: false
        default: ''

# One deploy at a time; a newer run supersedes an in-flight one.
concurrency:
  group: deploy-nahiatours
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || inputs.cloudflare_api_token }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
      KV_NAMESPACE_TITLE: nahiatours-data

    steps:
      - name: Mask the token
        run: echo "::add-mask::${{ inputs.cloudflare_api_token }}"
        if: inputs.cloudflare_api_token != ''

      - name: Require a token
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::error::No Cloudflare API token."
          echo "Add CLOUDFLARE_API_TOKEN under Settings → Secrets and variables →"
          echo "Actions (Workers Scripts: Edit + Workers KV Storage: Edit)."
          exit 1

      # A secret pasted with a trailing newline builds an Authorization header
      # Cloudflare rejects with 6003 before it looks at what the token may do.
      - name: Normalize the token
        run: |
          clean="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          echo "::add-mask::$clean"
          echo "CLOUDFLARE_API_TOKEN=$clean" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # THIS BRANCH IS THE SOURCE. It is what every other site was seeded FROM,
      # so nothing is ever cloned INTO it. There is no clone-kv step here on
      # purpose, and there must not be one.
      - name: Inventory the KV namespaces
        run: node scripts/kv-inventory.mjs
        env:
          KV_INVENTORY_TITLES: nahiatours-data,beautiful-tours-data,transporturist-data,ldvip-data,amigotours-data

      # provision-kv → populate-local-data → sitemap → SEO → vite build.
      - name: Build
        run: npm run build

      - name: Show the resolved KV binding
        run: |
          echo "wrangler.toml KV binding after the build:"
          sed -n '/managed by scripts\/provision-kv/,/<<< managed/p' wrangler.toml
          if ! grep -q 'kv_namespaces' wrangler.toml; then
            echo "::error::No KV binding was written. The deploy would unbind the"
            echo "namespace and the site would fall back to the bundled /data/*.json."
            exit 1
          fi

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          # v3 drops `run_worker_first` under [assets] with a warning, which
          # would stop the Worker seeing requests that match a static file —
          # every API route included.
          wranglerVersion: '4'
          # Stamped so /api/health can report which commit is live. --var is
          # merged with the [vars] already in wrangler.toml, not substituted
          # for them.
          command: deploy --var BUILD_COMMIT:${{ github.sha }} --var BUILD_TIME:${{ github.event.repository.updated_at }}

      - name: Report where it landed
        run: |
          {
            echo "### nahia.tours deployed"
            echo ""
            echo "Worker \`nahiatours\`, from \`main\` at \`${GITHUB_SHA::7}\`."
            echo ""
            echo "Check it with <https://nahia.tours/api/health> — it reports the"
            echo "branch that built it and whether KV and Workers AI are bound."
          } >> "$GITHUB_STEP_SUMMARY"
