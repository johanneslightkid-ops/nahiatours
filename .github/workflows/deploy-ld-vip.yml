# Deploys the LD VIP redesign to its own Cloudflare Worker.
#
# This is the *second* deploy path, and the optional one. The repository is
# already connected to Cloudflare Workers Builds, which builds this branch on
# every push and publishes it at its own branch URL — that is what actually
# ships today. This workflow exists for the case where the branch should live
# as a Worker of its own (`ld-vip`) rather than as a branch build of the
# connected project.
#
# So it SKIPS itself when there is no CLOUDFLARE_API_TOKEN, rather than
# failing: an absent optional path is not a broken build, and a red check on
# the pull request would be a false alarm.
#
# This workflow only ever runs on the `ld_vip` branch, and wrangler.toml on that
# branch names the Worker `ld-vip`. Both of those have to be wrong at the same
# time for this to touch the `nahiatours` deployment.
#
# To turn it on, add one repository secret: CLOUDFLARE_API_TOKEN, with
#   • Workers Scripts: Edit    (to deploy)
#   • Workers KV Storage: Edit (so scripts/provision-kv.mjs can create and bind
#     the `ld-vip-data` namespace — without it the deploy still succeeds and the
#     site reads from the JSON bundled at /data/*.json)
# Add it under Settings → Secrets and variables → Actions. If the token can see
# more than one Cloudflare account, add CLOUDFLARE_ACCOUNT_ID too.

name: Deploy LD VIP

on:
  push:
    branches: [ld_vip]
  workflow_dispatch:

# One deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: deploy-ld-vip
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Job-level env, not per-step: the `secrets` context is not available in a
    # step's `if`, but `env` is — which is what lets the preflight below check
    # for the token. wrangler and provision-kv.mjs both read these names
    # directly, so nothing else has to pass them along.
    env:
      # CF_API_TOKEN is accepted as an alias so an existing secret under that
      # name works without being duplicated.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
      SITE_URL: ${{ vars.SITE_URL }}

    steps:
      # No token means this path is simply not in use — say so and stop, in
      # green. Cloudflare Workers Builds is deploying the branch either way.
      - name: Skip unless the standalone-Worker path is configured
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::notice::Skipping: no CLOUDFLARE_API_TOKEN, so this branch is not"
          echo "::notice::being deployed as a standalone ld-vip Worker from Actions."
          echo "Cloudflare Workers Builds still builds and publishes this branch."
          echo ""
          echo "To deploy it as its own Worker instead, add CLOUDFLARE_API_TOKEN under"
          echo "Settings → Secrets and variables → Actions, with Workers Scripts: Edit"
          echo "and Workers KV Storage: Edit (the second lets scripts/provision-kv.mjs"
          echo "create and bind the ld-vip-data namespace)."

      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != ''

      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: '20'
          cache: npm

      # .npmrc pins legacy-peer-deps, so a plain `npm ci` is enough.
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm ci

      # provision-kv → populate-local-data → sitemap → SEO → vite build.
      - name: Build
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm run build

      - name: Deploy to Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
          # The action defaults to wrangler 3, which does not understand
          # `run_worker_first` under [assets] and drops it with a warning — the
          # Worker would then never see requests for paths that match a static
          # file, so the API routes and the canonical check would stop running.
          # v4 is also what `npm run deploy` gets from npx.
          wranglerVersion: '4'
          # `npm run build` already ran above, and it is what writes the KV
          # binding into wrangler.toml — so deploy only, never rebuild here.
          command: deploy

      - name: Report where it landed
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          echo "### LD VIP deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Worker \`ld-vip\`, from branch \`ld_vip\` at \`${GITHUB_SHA::7}\`." >> "$GITHUB_STEP_SUMMARY"
          echo "It is reachable at \`https://ld-vip.<your-subdomain>.workers.dev\`." >> "$GITHUB_STEP_SUMMARY"
