# Deploys the LD VIP redesign to its own Cloudflare Worker.
#
# This workflow only ever runs on the `ld_vip` branch, and wrangler.toml on that
# branch names the Worker `ld-vip`. Both of those have to be wrong at the same
# time for this to touch the `nahiatours` deployment.
#
# It needs one repository secret: CLOUDFLARE_API_TOKEN, with
#   • Workers Scripts: Edit   (to deploy)
#   • Workers KV Storage: Edit (so scripts/provision-kv.mjs can create and bind
#     the `ld-vip-data` namespace — without it the deploy still succeeds and the
#     site reads from the JSON bundled at /data/*.json)
# Add it under Settings → Secrets and variables → Actions. If the account has
# more than one Cloudflare account attached to the token, also add
# CLOUDFLARE_ACCOUNT_ID.

name: Deploy LD VIP

on:
  push:
    branches: [ld_vip]
  workflow_dispatch:

# One deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: deploy-ld-vip
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # The repo pins .npmrc legacy-peer-deps, so a plain `npm ci` is enough.
      - run: npm ci

      # provision-kv → populate-local-data → sitemap → SEO → vite build.
      - name: Build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: npm run build

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # `npm run build` already ran above, and it is what writes the KV
          # binding into wrangler.toml — so deploy only, never rebuild here.
          command: deploy
