# Deploys Exclusive Dominican Tours to its own Cloudflare Worker.
#
# This is a SEPARATE SITE out of the same repository, not a change to any
# existing one, and it is never merged into another branch. It was forked from
# El Cortecito's functionality and dressed in its own design.
#
# Three things keep it away from every other site, and all three would have to
# fail at once for a run here to touch one:
#
#   • wrangler.toml on this branch names the Worker `exclusive-tours`, and
#     `wrangler deploy` addresses a Worker by name — never by id;
#   • this workflow only runs on the `exclusive-dominican-tours` branch;
#   • the KV namespace is `exclusive-tours-data`, pinned by id in wrangler.toml.
#
# THE DATA is this site's own. Nothing is copied from any other namespace —
# not even on the first deploy: the catalogue, the brand and the copy ship in
# public/data/*.json (Exclusive Dominican Tours' own tours, transfers, blog
# and policies), and the Worker serves those until the admin panel saves its
# own version into exclusive-tours-data. Seeding from nahia.tours here would
# put another company's tours over this one's.
#
# THE TOKEN comes from a repository secret. It needs:
#   • Workers Scripts: Edit    — to deploy
#   • Workers KV Storage: Edit — for provision-kv.mjs to confirm the namespace
# Add it under Settings → Secrets and variables → Actions.

name: Deploy Exclusive Dominican Tours

# `push` is the trigger that matters: GitHub registers a dispatch-only
# workflow only once its file is on the default branch, which this is not.
on:
  push:
    branches: [exclusive-dominican-tours]
  workflow_dispatch:
    inputs:
      cloudflare_api_token:
        description: >-
          One-off Cloudflare API token (Workers Scripts: Edit + Workers KV
          Storage: Edit). Leave empty to use the CLOUDFLARE_API_TOKEN secret.
          Rotate any token passed this way once the deploy is done.
        required: false
        default: ''

# One deploy at a time; a newer run supersedes an in-flight one.
concurrency:
  group: deploy-exclusive-tours
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || inputs.cloudflare_api_token }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || 'd5272033401c64f8cc6ce650a8321cb2' }}
      KV_NAMESPACE_TITLE: exclusive-tours-data
      # So the sitemap, canonical URLs and OpenGraph tags point at this
      # deployment rather than at production's domain.
      SITE_URL: ${{ vars.EXCLUSIVE_TOURS_SITE_URL || 'https://exclusive-tours.johannes-neugschwentner.workers.dev' }}

    steps:
      - name: Mask the token
        run: echo "::add-mask::${{ inputs.cloudflare_api_token }}"
        if: inputs.cloudflare_api_token != ''

      # This branch has no other way to ship, so a silent green here would be a
      # lie. Fail rather than skip.
      - name: Require a token
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::error::No Cloudflare API token."
          echo "Add CLOUDFLARE_API_TOKEN under Settings → Secrets and variables →"
          echo "Actions (Workers Scripts: Edit + Workers KV Storage: Edit), or pass"
          echo "one as the cloudflare_api_token input when dispatching this workflow."
          exit 1

      # A secret pasted with a trailing newline builds an Authorization header
      # Cloudflare rejects with 6003; trim it once, and re-mask the result.
      - name: Normalize the token
        run: |
          clean="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          echo "::add-mask::$clean"
          echo "CLOUDFLARE_API_TOKEN=$clean" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      # A deploy that reached the wrong Worker would be the one unrecoverable
      # mistake here, so the name is asserted before anything is uploaded.
      - name: Check this branch deploys to exclusive-tours
        run: |
          name="$(grep -m1 '^name *= *' wrangler.toml | sed 's/.*= *"\(.*\)"/\1/')"
          echo "wrangler.toml names the Worker: $name"
          if [ "$name" != "exclusive-tours" ]; then
            echo "::error::wrangler.toml names \"$name\", not \"exclusive-tours\". Refusing to deploy."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # .npmrc pins legacy-peer-deps, so a plain `npm ci` is enough.
      - run: npm ci

      # provision-kv → populate-local-data → sitemap → SEO → vite build.
      - name: Build
        run: npm run build

      - name: Show the resolved KV binding
        run: |
          echo "wrangler.toml KV binding after the build:"
          grep -n -A2 '^\[\[kv_namespaces\]\]' wrangler.toml
          if ! grep -q 'id = "5c534450c0cf47fa9d50560f235c4630"' wrangler.toml || [ "$(grep -c '^\[\[kv_namespaces\]\]' wrangler.toml)" != 1 ]; then
            echo "::error::DATA_KV_F must be bound once, to exclusive-tours-data. Refusing to deploy."
            exit 1
          fi

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          # wrangler 3 drops `run_worker_first` under [assets], which would
          # stop the API routes from running.
          wranglerVersion: '4'
          # `npm run build` already ran above; deploy only. Stamped so
          # /api/health can report which commit is live.
          command: deploy --var BUILD_COMMIT:${{ github.sha }} --var BUILD_TIME:${{ github.event.repository.updated_at }}

      - name: Report where it landed
        run: |
          {
            echo "### Exclusive Dominican Tours deployed"
            echo ""
            echo "<https://exclusive-tours.johannes-neugschwentner.workers.dev>"
            echo ""
            echo "Worker \`exclusive-tours\`, from branch \`exclusive-dominican-tours\` at \`${GITHUB_SHA::7}\`."
            echo ""
            echo "KV: \`exclusive-tours-data\`. Nothing is copied from other sites; keys it does not have yet fall back to the bundled \`/data/*.json\`."
          } >> "$GITHUB_STEP_SUMMARY"
