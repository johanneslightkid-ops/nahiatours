# Deploys Willy Tours (branch el-cortecito) — the gallery design — to its own Worker.
#
# A SEPARATE SITE out of the same repository, branched from `elcortecito`
# and never merged into any other branch (see CLAUDE.md). Its own Worker,
# `el-cortecito`, its own KV namespace, `el-cortecito-data`.
#
# Three things keep it away from every other site, and all three would have
# to fail at once for a run here to touch one:
#
#   • wrangler.toml on this branch names the Worker `el-cortecito`, and the
#     deploy asserts that name before it uploads anything;
#   • this workflow only runs on the `el-cortecito` branch;
#   • the KV binding is asserted to be `el-cortecito-data`, never the
#     namespace it was seeded from.
#
# THE DATA is seeded once, from `elcortecito-data`, on the very first deploy
# (the namespace does not exist or is empty), and only the content: the
# catalogue, blog, story and reviews. Guests' requests and payments, payment
# credentials and notification keys are the other site's and are withheld
# (EXCLUDE_KEYS). The brand is then given this site's own identity
# (scripts/stub-brand.mjs) — name, owner, WhatsApp — with every payment link
# and social account left empty for the operator to fill in. From then on
# the two namespaces are independent, and a push never copies anything again.
#
# THE TOKEN is the repository's CLOUDFLARE_API_TOKEN secret (Workers Scripts:
# Edit + Workers KV Storage: Edit), the same one every site branch uses.

name: Deploy Willy Tours (el-cortecito)

# `push` is the trigger that matters. GitHub registers a `workflow_dispatch`
# workflow only once its file has appeared on the DEFAULT branch — and `main`
# carries no .github/workflows, so a dispatch-only workflow here would be
# invisible to the API and to the Actions UI. A push-triggered workflow has no
# such requirement; it runs from whichever branch it lives on.
on:
  push:
    branches: [el-cortecito]
  workflow_dispatch:
    inputs:
      cloudflare_api_token:
        description: >-
          One-off Cloudflare API token (Workers Scripts: Edit + Workers KV
          Storage: Edit). Leave empty to use the CLOUDFLARE_API_TOKEN secret.
          Rotate any token passed this way once the deploy is done.
        required: false
        default: ''
      source_kv_title:
        description: >-
          Title of the KV namespace to copy data from. Leave empty to use
          elcortecito-data.
        required: false
        default: ''
      seed_kv_from_source:
        description: >-
          Copy keys this site is MISSING from the source namespace. This is the
          one-time bootstrap for a brand-new site and is off by default: on an
          established site it silently restores content that was deleted here
          on purpose, and gives any newly-stored key the production site's
          value. A key this site already has is never touched either way.
        required: false
        type: boolean
        default: false
      overwrite_existing:
        description: >-
          Re-copy the source over keys this site ALREADY has. This destroys
          anything edited through this site's own admin panel. Off by default,
          and there is no way to turn it on from a push — see scripts/clone-kv.mjs.
        required: false
        type: boolean
        default: false

# One deploy at a time; a newer run supersedes an in-flight one.
concurrency:
  group: deploy-el-cortecito
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Job-level env, not per-step: the `secrets` context is not available in a
    # step's `if`, but `env` is. wrangler, provision-kv.mjs and clone-kv.mjs
    # all read these names directly, so nothing else has to pass them along.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || inputs.cloudflare_api_token }}
      # Falls back to the literal account id, which is also pinned in
      # wrangler.toml. Without it, the KV scripts have to discover the account
      # by listing /accounts and wrangler by reading /memberships — an endpoint
      # a Workers-scoped token cannot read.
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || 'd5272033401c64f8cc6ce650a8321cb2' }}
      KV_NAMESPACE_TITLE: el-cortecito-data
      SOURCE_KV_TITLE: ${{ inputs.source_kv_title || 'elcortecito-data' }}
      # The source site's own business, never copied: its guests' requests,
      # payments and activity, its payment and notification credentials.
      EXCLUDE_KEYS: 'payment-secrets,payment-order:,contact-requests,pay-attempts,pay:,act:,rl:,notify-config,social-api-settings'
      # Seed, do not sync. clone-kv.mjs leaves every key the destination
      # already has exactly as it is unless this says otherwise, so a redeploy
      # cannot roll a site back to production's content. It used to be the
      # other way round, and on 2026-09-17 that quietly replaced the Beautiful
      # Tours site's brand, tours and story with nahia.tours' own.
      OVERWRITE: ${{ inputs.overwrite_existing == true && 'true' || 'false' }}
      # So the sitemap, canonical URLs and OpenGraph tags point at this
      # deployment rather than at production's domain.
      SITE_URL: ${{ vars.EL_CORTECITO_SITE_URL || 'https://el-cortecito.johannes-neugschwentner.workers.dev' }}

    steps:
      # First thing in the job, before the token can reach any other output: a
      # token that arrived as an input is not automatically a registered
      # secret, so ask the runner to redact it from every subsequent log line.
      - name: Mask the token
        run: echo "::add-mask::${{ inputs.cloudflare_api_token }}"
        if: inputs.cloudflare_api_token != ''

      # This branch has no other way to ship, so a silent green here would be a
      # lie. Fail rather than skip.
      - name: Require a token
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::error::No Cloudflare API token."
          echo "Add CLOUDFLARE_API_TOKEN under Settings → Secrets and variables →"
          echo "Actions (Workers Scripts: Edit + Workers KV Storage: Edit), or pass"
          echo "one as the cloudflare_api_token input when dispatching this workflow."
          exit 1

      # Everything downstream reads the token from the environment, so trim it
      # in one place. A secret pasted with a trailing newline builds an
      # Authorization header Cloudflare rejects with 6003 before it ever looks
      # at what the token is allowed to do. Re-masking is required: the trimmed
      # string is a different string from the registered secret, so the
      # automatic redaction does not cover it.
      - name: Normalize the token
        run: |
          clean="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          echo "::add-mask::$clean"
          echo "CLOUDFLARE_API_TOKEN=$clean" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')" >> "$GITHUB_ENV"

          # Enough to identify a mis-pasted credential without printing one.
          if   [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then src="CLOUDFLARE_API_TOKEN"
          elif [ -n "${{ secrets.CF_API_TOKEN }}" ];         then src="CF_API_TOKEN (fallback — is this stale?)"
          elif [ -n "${{ inputs.cloudflare_api_token }}" ];  then src="the workflow_dispatch input"
          else src="nowhere"; fi
          echo "Supplied by:  $src"
          echo "Length:       ${#clean}"

          bad="$(printf '%s' "$clean" | tr -d 'A-Za-z0-9_.-' | fold -w1 | sort -u | tr -d '\n')"
          if [ -n "$bad" ]; then
            echo "Stray chars:  [$bad] — an API token contains none of these."
            echo "              Re-add the secret as the bare token, nothing around it."
          else
            echo "Stray chars:  none"
          fi

      - uses: actions/checkout@v4

      # A deploy that reached the wrong Worker would be the one unrecoverable
      # mistake here, so the name is asserted before anything is uploaded
      # rather than read out of the log afterwards.
      - name: Check this branch deploys to el-cortecito
        run: |
          name="$(grep -m1 '^name *= *' wrangler.toml | sed 's/.*= *"\(.*\)"/\1/')"
          echo "wrangler.toml names the Worker: $name"
          if [ "$name" != "el-cortecito" ]; then
            echo "::error::wrangler.toml names \"$name\", not \"el-cortecito\". Refusing to deploy."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # .npmrc pins legacy-peer-deps, so a plain `npm ci` is enough.
      - run: npm ci

      # Is this the site's very first deploy? True only when the namespace does
      # not exist yet or holds no keys at all. Anything else — one key is
      # enough — means the site has content of its own and nothing is copied.
      - name: Check whether this site's KV is brand new
        id: fresh
        run: |
          node --input-type=module -e '
            const token = process.env.CLOUDFLARE_API_TOKEN;
            const account = process.env.CLOUDFLARE_ACCOUNT_ID;
            const title = process.env.KV_NAMESPACE_TITLE;
            const api = (p) => fetch(`https://api.cloudflare.com/client/v4/accounts/${account}${p}`, { headers: { Authorization: `Bearer ${token}` } }).then((r) => r.json());
            let fresh = false;
            try {
              let page = 1, found = null;
              for (;;) {
                const res = await api(`/storage/kv/namespaces?per_page=100&page=${page}`);
                if (!res.success) throw new Error(JSON.stringify(res.errors));
                found = res.result.find((ns) => ns.title === title) || found;
                if (found || res.result.length < 100) break;
                page++;
              }
              if (!found) {
                fresh = true;
                console.log(`${title} does not exist yet: first deploy, will seed.`);
              } else {
                const keys = await api(`/storage/kv/namespaces/${found.id}/keys?limit=10`);
                fresh = keys.success && keys.result.length === 0;
                console.log(`${title} (${found.id}) holds ${keys.result?.length ?? "?"}${keys.result?.length === 10 ? "+" : ""} key(s): ${fresh ? "empty, will seed" : "established, will not seed"}.`);
              }
            } catch (error) {
              console.log(`Could not tell (${error.message}); not seeding.`);
            }
            const { appendFileSync } = await import("node:fs");
            appendFileSync(process.env.GITHUB_OUTPUT, `fresh=${fresh}\n`);
          '

      # Create el-cortecito-data if needed and fill it from the source. This runs
      # BEFORE the build, because `npm run build` invokes provision-kv.mjs,
      # which resolves the same namespace title and writes the binding into
      # wrangler.toml — so by deploy time the binding points at a namespace
      # that already has the data in it.
      #
      # Copying the data is a convenience, not the ship. If it fails the site
      # still serves — reads fall back to the JSON bundled at /data/*.json — so
      # a naming conflict or a narrowly-scoped token should not stop the design
      # from deploying. It must stay visible, though: the summary below says
      # plainly when the copy did not happen, because a green run that quietly
      # served stale seed data would be the actual lie.
      - name: Clone the KV data
        id: kv
        if: inputs.seed_kv_from_source == true || steps.fresh.outputs.fresh == 'true'
        continue-on-error: true
        run: node scripts/clone-kv.mjs

      # This site's own identity, over the brand that came with the copy.
      # First deploy only: afterwards the brand is edited in the admin.
      - name: Give the brand its own identity
        if: steps.fresh.outputs.fresh == 'true' && steps.kv.outcome == 'success'
        run: node scripts/stub-brand.mjs
        env:
          SOCIAL_RESET: 'true'
          BRAND_PATCH: >-
            {"brandName":"Willy Tours","contactName":"Willy","phoneNumber":"+1 (809) 123 4567",
            "paypalMeLink":"","verifoneLink":"","azulLink":"","cardnetLink":"","brandicon":"","stripeEnabled":false}

      # The site was first stubbed as "El Cortecito Tours" and is called
      # "Willy Tours" now. Renames the stored brand only while it still has the
      # old stub name, so a name chosen later in the admin is never overwritten.
      - name: Rename the brand to Willy Tours (once)
        run: node scripts/stub-brand.mjs
        env:
          ONLY_IF_BRAND_NAME: El Cortecito Tours
          BRAND_PATCH: '{"brandName":"Willy Tours"}'

      # provision-kv → populate-local-data → sitemap → SEO → vite build.
      # provision-kv.mjs finds the namespace clone-kv just filled, by title.
      - name: Inventory the KV namespaces
        run: node scripts/kv-inventory.mjs
        env:
          KV_INVENTORY_TITLES: elcortecito-data,el-cortecito-data

      - name: Build
        run: npm run build

      - name: Show the resolved KV binding
        run: |
          echo "wrangler.toml KV binding after the build:"
          grep -n -A2 '^\[\[kv_namespaces\]\]' wrangler.toml || true
          count="$(grep -c '^\[\[kv_namespaces\]\]' wrangler.toml || true)"
          if [ "$count" != 1 ]; then
            echo "::error::DATA_KV_F must be bound exactly once (found $count). Refusing to deploy."
            exit 1
          fi
          # Never the namespace this site was seeded from, nor any other site's.
          for other in 5026f24391e24f13b76f5e4918d6d72d b4e2637d5f45438aac8e504353a92a9f b866189176fb46188c10240cdce3bf9d 9f66ad41f7c0469fb1178d3de75b0e68 39da5ca1858a4251a3130eaf7b8f2172 03cc4cd848174de1bfdbd8009b9a3cc0 373ab3472b5c4565a76e3bc9363fe25b; do
            if grep -q "id = \"$other\"" wrangler.toml; then
              echo "::error::DATA_KV_F is bound to another site's namespace ($other). Refusing to deploy."
              exit 1
            fi
          done

      # A brand-new Worker name is refused by `wrangler deploy` here with
      # "This Worker does not exist on your account [10007]". Creating it first
      # with a placeholder through the API, then deploying over it, is the path
      # every existing site takes. Does nothing once the Worker exists.
      - name: Make sure the Worker exists
        run: |
          cat > /tmp/ensure-worker.mjs <<'JS'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const name = 'el-cortecito';
          const api = `https://api.cloudflare.com/client/v4/accounts/${account}`;
          const call = async (path, init = {}) => {
            const response = await fetch(`${api}${path}`, { ...init, headers: { Authorization: `Bearer ${token}`, ...(init.headers || {}) } });
            const body = await response.json().catch(() => ({}));
            console.log(`${init.method || 'GET'} ${path} → ${response.status} ${JSON.stringify({ success: body.success, errors: body.errors })}`);
            return body;
          };
          const placeholder = 'export default { fetch() { return new Response("El Cortecito Tours is on its way."); } };';

          const settings = await call(`/workers/scripts/${name}/settings`);
          if (settings.success) { console.log(`${name} exists with content.`); process.exit(0); }

          // A Worker with no versions: a shell left by an earlier failed
          // deploy. Remove it so the name can be created cleanly.
          const list = await call('/workers/workers?per_page=100');
          const shell = (list.result || []).find((worker) => worker.name === name);
          if (shell) {
            console.log(`shell: ${JSON.stringify({ id: shell.id, created_on: shell.created_on, deployed_on: shell.deployed_on })}`);
            if (!shell.deployed_on) await call(`/workers/workers/${shell.id}`, { method: 'DELETE' });
          }

          const form = new FormData();
          form.append('metadata', new Blob([JSON.stringify({ main_module: 'index.js', compatibility_date: '2024-05-01' })], { type: 'application/json' }));
          form.append('index.js', new Blob([placeholder], { type: 'application/javascript+module' }), 'index.js');
          const put = await call(`/workers/scripts/${name}`, { method: 'PUT', body: form });
          if (!put.success) {
            // The new Workers API: create the Worker, give it a version, deploy it.
            let worker = (await call('/workers/workers?per_page=100')).result?.find((w) => w.name === name);
            if (!worker) worker = (await call('/workers/workers', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name }) })).result;
            if (!worker) process.exit(1);
            const version = await call(`/workers/workers/${worker.id}/versions?deploy=true`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                compatibility_date: '2024-05-01',
                main_module: 'index.js',
                modules: [{ name: 'index.js', content_type: 'application/javascript+module', content_base64: Buffer.from(placeholder).toString('base64') }],
              }),
            });
            if (!version.success) process.exit(1);
          }
          await call(`/workers/scripts/${name}/subdomain`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ enabled: true }) });
          JS
          node /tmp/ensure-worker.mjs

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          # The action defaults to wrangler 3, which does not understand
          # `run_worker_first` under [assets] and drops it with a warning — the
          # Worker would then never see requests for paths that match a static
          # file, so the API routes would stop running.
          wranglerVersion: '4'
          # `npm run build` already ran above, and it is what writes the KV
          # binding into wrangler.toml — so deploy only, never rebuild here.
          # Stamped so /api/health can report which commit is live.
          # --var is merged with the [vars] already in wrangler.toml,
          # not substituted for them.
          command: deploy --var BUILD_COMMIT:${{ github.sha }} --var BUILD_TIME:${{ github.event.repository.updated_at }}

      - name: Report where it landed
        run: |
          {
            echo "### Willy Tours (el-cortecito) deployed"
            echo ""
            echo "<https://el-cortecito.johannes-neugschwentner.workers.dev>"
            echo ""
            echo "Worker \`el-cortecito\`, from branch \`el-cortecito\` at \`${GITHUB_SHA::7}\`."
            echo ""
            if [ "${{ inputs.seed_kv_from_source }}" != "true" ] && [ "${{ steps.fresh.outputs.fresh }}" != "true" ]; then
              echo "KV: nothing copied. This site reads its own namespace."
            elif [ "${{ steps.kv.outcome }}" != "success" ]; then
              echo "> [!WARNING]"
              echo "> **KV was not copied.** The site is up, reading the seed data bundled at \`/data/*.json\`."
            else
              echo "KV: ${{ steps.kv.outputs.keys_copied }} key(s) seeded from \`${{ steps.kv.outputs.source_title }}\` into \`el-cortecito-data\` (\`${{ steps.kv.outputs.namespace_id }}\`), the other site's guests, payments and credentials withheld; brand set to Willy Tours."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
