# Gives each site German and French content in its own KV namespace, by
# translating that site's own copy. Only creates missing <resource>-fr/-de
# keys; never overwrites or deletes anything. Dry run unless the env says so.
name: KV translate

on:
  push:
    branches: [claude/eager-edison-peyvhu]
    paths: [.github/workflows/kv-translate.yml, scripts/kv-translate.mjs]

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
      KV_TRANSLATE_APPLY: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: git fetch --no-tags origin main beautiful-tours transporturist ldvip amigotours bavaro-tours
      - run: node scripts/kv-translate.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kv-translate
          path: kv-translate
          retention-days: 90
